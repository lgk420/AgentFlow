# AgentFlow 本地基础设施
# ============================================================
# 用法（docker 装在 WSL 里，请在 Ubuntu 终端执行）：
#   cd /mnt/c/workspaces/AgentFlow
#   docker compose up -d                 # 启动 redis + postgres
#   docker compose --profile local-llm up -d   # 额外启动本地 LLM（ollama）
#
# 版本策略：镜像一律"主版本固定"，不用 latest —— 保证环境可复现；
# 每个镜像都注释了选版理由。见 docs/架构设计.md
# ============================================================

name: agentflow

services:
  redis:
    image: redis:7-alpine
    container_name: agentflow-redis
    # 选版理由：Redis 7 是长期稳定大版本，Spring Data Redis / Lettuce 兼容性好；
    # 主版本固定 → 自动跟随小版本补丁，且不被 latest 的版本漂移影响可复现性。
    # alpine 版：体积小、内存占用低，纯本地开发足够。
    ports:
      - "6379:6379"          # 宿主机:容器 —— Windows 上的 Java 应用经 WSL2 localhost 转发访问
    volumes:
      - redisdata:/data      # 数据落卷：容器重建/升级不丢数据
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped  # WSL 重启后容器自动拉起；docker compose down 后不会被拉起

  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentflow-postgres
    # 选版理由：此 tag 同时固定 Postgres 主版本 16 与 pgvector 扩展版本；
    # pg16 是 Spring-AI VectorStore 集成广泛验证的组合，换主版本需回归客户端兼容性。
    # 这才是"轻量但真实"的向量库选择（与 Milvus 可替换，见 docs/架构设计.md）。
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-agentflow}"
      POSTGRES_USER: "${POSTGRES_USER:-agentflow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-agentflow}"
      # 密码可覆盖：在仓库根放 .env（已 gitignore），如 POSTGRES_PASSWORD=xxx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentflow} -d ${POSTGRES_DB:-agentflow}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 可选：本地 LLM（离线演示用），默认不启动。
  # 首次拉模型：docker compose --profile local-llm exec ollama ollama pull qwen2.5:7b
  ollama:
    image: ollama/ollama:latest
    container_name: agentflow-ollama
    # 版本策略的特例：ollama 是可选本地开发工具，不参与"必须可复现"的基础设施；
    # 真正决定环境的是运行时下载的模型（qwen2.5:7b 等），镜像 tag 反而次要，故用 latest。
    profiles: ["local-llm"]  # 显式 --profile local-llm 才启动
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  # 可选：本地重排服务（RAG 两阶段检索的重排环节），默认不启动。
  # 为什么需要独立服务：ollama 只有「生成」「嵌入」两条推理路径，没有 rerank 端点，
  #   cross-encoder 类模型（如 bge-reranker）无法在其上运行（实测三种社区模型均失败，见 docs/架构设计.md）。
  # 首次装模型：
  #   docker compose --profile rerank exec xinference \
  #     xinference launch --model-name bge-reranker-v2-m3 --model-type rerank
  xinference:
    image: xprobe/xinference:v3.4.0-cpu
    container_name: agentflow-xinference
    # 选版理由：固定到具体小版本（3.4.0），符合本文件"环境可复现"的原则。
    # `-cpu` 后缀是硬要求：`xprobe/xinference:latest` 是 GPU 版（要 CUDA），无 GPU 机器起不来。
    # 体积较大（12.2GB）——它把所有推理后端（vLLM/llama.cpp/GPTQ 等）都打进了同一个镜像，
    #   以此换取"一个服务支持全部模型类型"，这是选它而非 TEI 的代价。
    # 镜像源为 Docker Hub，本机直连不通，需经加速站拉取（docker.m.daocloud.io/xprobe/...）。
    profiles: ["rerank"]      # 显式 --profile rerank 才启动
    ports:
      # 只绑本机回环，不绑 0.0.0.0——下面关闭了鉴权，必须同时收窄访问面，二者是一组的。
      # WSL2 的 localhost 转发仍能让 Windows 上的 Java 应用经 localhost:9997 访问到。
      - "127.0.0.1:9997:9997"   # API + Web UI
    environment:
      # 模型走魔搭（阿里）下载：huggingface.co 在本机不通，而 Xinference 支持切换模型源
      XINFERENCE_MODEL_SRC: modelscope
      # 关闭鉴权：Xinference 3.0 起默认开启数据库鉴权，不关的话 CLI 报
      #   "Cannot find access token, please login first!"，所有 API 返回 401。
      # 安全前提：端口已限定 127.0.0.1，外部网络不可达——这条与上面的绑定是配套的，
      #   改任意一条都要同时评估另一条。若将来要放开绑定到 0.0.0.0 或部署到共享环境，
      #   必须先改回 true，并走 /v1/admin/setup 建管理员 + API Key。
      XINFERENCE_AUTH_ADVANCED: "false"
    volumes:
      - xinference:/root/.xinference   # 模型缓存落卷；不挂的话容器重建要重下 2.3GB
    command: ["xinference-local", "-H", "0.0.0.0", "--port", "9997"]
    restart: unless-stopped

volumes:
  redisdata:
  pgdata:
  ollama:
  xinference:
