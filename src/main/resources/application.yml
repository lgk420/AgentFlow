spring:
  application:
    name: agentflow
  profiles:
    # 默认激活 local profile → 自动加载 application-local.yml（gitignore，本地覆盖/真实 key）
    default: local
  jackson:
    deserialization:
      # DSL 坏配置尽早暴露：顶层 / 边字段拼错立即解析报错（GraphValidator 仍负责白名单结构校验，见 DSL使用说明 7）
      fail-on-unknown-properties: true
  ai:
    # 多 provider 选择（T6.2）：聊天走 OpenAI 兼容（DeepSeek），嵌入走本地 Ollama。
    # 两边 chat/embedding autoconfig 都 matchIfMissing=true——不显式选会双 ChatModel 并存启动炸（T6.2 验证）。
    # 聊天要切本地 Ollama 离线演示：改 model.chat=ollama 即可（需 ollama 拉聊天模型，如 qwen2.5:7b）。
    model:
      chat: openai
      embedding: ollama
    openai:
      # 聊天 provider：OpenAI 兼容（DeepSeek / Qwen 同一端点形态，换 base-url/model/api-key 即可）
      # OpenAI 兼容 base——Spring AI 会自动追加 /v1/chat/completions，所以这里不能带 /v1 或 /anthropic 等路径后缀（否则 404）
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      # OpenAI 自动配置要求 key 非空才建 bean；dummy 仅让无 key 时上下文能起（真实 key 由环境变量 LLM_API_KEY 覆盖）
      api-key: ${LLM_API_KEY:sk-no-key-set}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-v4-flash}
    ollama:
      # 嵌入 provider（T6.2）：本地 Ollama，bge-m3（中英双语，1024 维，CPU 可跑，QA 65/66）。
      # 起 Docker：docker compose --profile local-llm up -d && docker compose --profile local-llm exec ollama ollama pull bge-m3
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    vectorstore:
      pgvector:
        # T6.2：pgvector 向量存储（compose 的 pgvector/pgvector:pg16）。
        # dimensions 必须 = 嵌入模型维度（bge-m3=1024），配错检索会报维度错误；
        # initialize-schema=true → 启动自动建表（需 postgres 在线，PgVectorStore.afterPropertiesSet 执行）。
        dimensions: 1024
        index-type: HNSW
        initialize-schema: true
  sql:
    init:
      # T10.1：执行 resources/schema.sql 建业务表（conversation_memory）。
      # 默认只对嵌入式数据库执行，这里显式设为 always 才管 Postgres；
      # SQL 全用 IF NOT EXISTS，每次启动重复执行无副作用。
      mode: always
  datasource:
    # T6.2：pgvector 数据源（compose postgres，env 可覆盖）
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/agentflow}
    username: ${POSTGRES_USER:agentflow}
    password: ${POSTGRES_PASSWORD:agentflow}
  data:
    redis:
      # WSL2 环境：容器跑在 WSL 里，Windows 侧通过 localhost 转发访问
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: ${SERVER_PORT:8080}

core:
  executor:
    # 就绪度调度并发线程数（wave 批派发，见架构 6.6）
    parallelism: 4
  run:
    # T7.3 事件驱动：POST /runs 发布 RunStarted 后轮询 checkpoint 到终态的配置
    poll-timeout-ms: 60000
    poll-interval-ms: 100
  event-driven:
    # T7.5：进程级处理失败的重投次数上限，超限进死信（agentflow:dlq）
    max-retries: 3

# T6.7：RAG 两阶段检索的重排配置。
# 为什么必须独立服务：Ollama 只有「生成」「嵌入」两条推理路径，没有 rerank 端点——
#   cross-encoder 类模型（bge-reranker）在其上跑不了（实测 /api/rerank 返回 404，
#   社区上传的模型要么加载即崩、要么 /api/embed 返回全零向量）。
#   服务搭建见 docs/重排服务搭建说明.md（compose 的 rerank profile）。
agentflow:
  rag:
    # T6.8：相似度阈值——低于它的块被丢弃，全被丢弃即判「未命中」，RAG 节点输出 hit=false，
    # 供 DSL 的 CONDITIONAL 边走拒答兜底分支，而不是让 LLM 拿着空上下文硬编。
    #
    # 为什么是两个阈值：两条路径的分数**量纲不同**，同一个数不可能同时适用。
    #   实测 42 块语料 / 50 条评测集：向量分 正 0.695 / 负 0.555（差 0.14，两团重叠，难设）；
    #                              重排分 正 0.784 / 负 0.007（差 0.78，中间大片空白，好设）。
    # 缺省 0.0 = 不启用过滤，行为与加阈值之前完全一致（基线可复现）。
    #
    # 该设多少：跑评测看 reports/rag-eval/ 的「阈值扫描」表。实测结论（42 块 / 50 条）：
    #   重排路径 0.05 → 正样本**零误杀**，负样本**100% 拦截**  ← 推荐
    #   向量路径 0.60 → 负样本只拦得住 75%，再往上误杀就崩（0.70 误杀 55%）
    # 即：**拒答这件事，纯向量基本做不到，重排之后才做得干净。**
    min-score:
      # 未启用重排（或重排降级回退）时生效；实测最优约 0.60，但只能拦 3/4 的负样本
      vector: ${RAG_MIN_SCORE_VECTOR:0.0}
      # 重排实际生效时用；实测 0.05 即可零误杀 + 全拦（负样本分都在 0.007 量级）
      reranked: ${RAG_MIN_SCORE_RERANKED:0.0}
    rerank:
      # 默认关闭：关闭时 RAG 节点不放大召回也不调重排服务，行为与加重排之前完全一致
      # ——基线可复现，对照实验才有意义。开启前先起服务：bash scripts/dev.sh up --llm --rerank
      enabled: ${RERANK_ENABLED:false}
      # Xinference 服务地址（compose 里只绑 127.0.0.1，WSL2 localhost 转发让 Windows 侧可访问）
      base-url: ${RERANK_BASE_URL:http://localhost:9997}
      # 对应 `xinference launch` 返回并注册的 model_uid
      model: ${RERANK_MODEL:bge-reranker-v2-m3}
      # 召回条数——交给重排的候选池。太小（接近 topK）重排没得挑，正确块若排在池外就够不着；
      # 太大等于把大半个库递过去、重排挑对的变得过于容易，收益虚高。
      # 实际生效值 = max(节点 topK, 本值)。
      recall-k: ${RERANK_RECALL_K:3}
      # 30s 而非 10s：CPU 下单次重排实测 P99 已达 8.7s，10s 只剩 1 秒余量；
      # 且模型长期未用会被卸载，冷启动首次调用要加载回内存，10s 会误判成服务不可用（实测踩过）。
      timeout-seconds: ${RERANK_TIMEOUT_SECONDS:30}

  # T10.1：对话记忆——跨会话存活的对话历史（Postgres 的 conversation_memory 表）。
  # 存储分层约定：运行态（checkpoint/事件流）→ Redis；业务数据（记忆/向量）→ Postgres。
  # 默认开启，但**只有传了 sessionId 的运行才会碰它**；不传就是无记忆的单次运行，现有调用方不受影响。
  memory:
    enabled: ${MEMORY_ENABLED:true}
    # 每次取多少条历史喂 prompt（读时截断，不删数据）。太小上下文断裂，太大 prompt 膨胀。
    history-limit: ${MEMORY_HISTORY_LIMIT:20}

# T5.5：MCP 服务器列表（来源③，McpToolSynchronizer 启动时逐个连接注册工具）。
# 默认注释掉——保持应用启动轻量（不拉子进程）；需要演示 MCP 工具时解开，改名前缀即可。
# 字段：name（服务器名）/ command+args（stdio 启动命令，${java.class.path} 由 McpConnector 解析为当前 JVM classpath）
#       / prefix（工具名前缀，防与内置 @AgentTool 重名）。
# 连接失败打 warning 跳过，不阻断启动（失败不阻断，T5.5 决策）。
