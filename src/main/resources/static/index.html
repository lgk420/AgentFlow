<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentFlow · 健身教练助手</title>
<!--
  单文件演示页（T10.5）——刻意不引入任何前端框架与构建工具。
  演示界面不是这个项目的重点，为它拉一整套工具链不划算；能证明后端是对的就够了。

  跑之前先起应用、注册工作流：
    curl -X POST localhost:8080/api/v1/workflows \
      -H "Content-Type: application/json" \
      --data @src/test/resources/testdata/workflows/fitness-coach/fitness-coach.json
  然后打开 http://localhost:8080

  两个身份维度都发给后端，缺省时由 DSL 的默认值兜底：
    userId    —— 训练日志的稳定身份（存 localStorage，默认 default-user；「新会话」不动它）
    sessionId —— 对话记忆的会话标识（UUID，「新会话」才换一个）
  前端可随意填，服务端不校验——**仅演示用，没有鉴权**。
-->
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         margin: 0; height: 100vh; display: flex; flex-direction: column; background: #f5f6f8; }
  header { padding: 12px 20px; background: #1f2937; color: #fff; display: flex;
           align-items: center; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sid { font-size: 12px; opacity: .6; font-family: ui-monospace, monospace; }
  header button { margin-left: auto; background: none; border: 1px solid rgba(255,255,255,.3);
                  color: #fff; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  header button:hover { background: rgba(255,255,255,.1); }

  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 76%; padding: 10px 14px; border-radius: 12px; line-height: 1.6;
         white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 3px; }
  .bot  { align-self: flex-start; background: #fff; border: 1px solid #e5e7eb;
          border-bottom-left-radius: 3px; }
  .err  { align-self: flex-start; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
  .sys  { align-self: center; font-size: 12px; color: #6b7280; font-family: ui-monospace, monospace; }

  #progress { padding: 8px 20px; font-size: 12px; color: #6b7280; min-height: 30px;
              font-family: ui-monospace, monospace; border-top: 1px solid #e5e7eb; background: #fafafa; }

  footer { display: flex; gap: 10px; padding: 14px 20px; background: #fff; border-top: 1px solid #e5e7eb; }
  footer input { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px;
                 font-size: 14px; font-family: inherit; }
  footer input:focus { outline: 2px solid #2563eb33; border-color: #2563eb; }
  footer button { padding: 10px 22px; background: #2563eb; color: #fff; border: 0;
                  border-radius: 8px; font-size: 14px; cursor: pointer; }
  footer button:disabled { background: #9ca3af; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>健身教练助手</h1>
  <span class="sid" id="sidLabel"></span>
  <span class="sid" id="userLabel"></span>
  <button id="resetBtn" title="清空本地会话，下次发送开启新会话">新会话</button>
</header>

<div id="log"></div>
<div id="progress"></div>

<footer>
  <input id="input" placeholder="说说你今天练了什么，或就之前的内容追问…" autocomplete="off">
  <button id="sendBtn">发送</button>
</footer>

<script>
// ── 会话标识：客户端生成并保持（服务端只校验不生成）────────────────────────
// 服务端无从知道「这两个请求是同一个人接着说的」，所以 sessionId 必须由客户端给。
const SESSION_KEY = 'agentflow.sessionId';
let sessionId = localStorage.getItem(SESSION_KEY);
if (!sessionId) {
  sessionId = crypto.randomUUID();
  localStorage.setItem(SESSION_KEY, sessionId);
}
document.getElementById('sidLabel').textContent = '会话 ' + sessionId.slice(0, 8);

// ── 用户标识：训练日志的稳定身份，跟 sessionId 是两码事 ────────────────────
// 换了 sessionId 只是「开个新会话」，换了 userId 才是「换了个人」——训练记录按它分账。
const USER_KEY = 'agentflow.userId';
let userId = localStorage.getItem(USER_KEY) || 'default-user';
localStorage.setItem(USER_KEY, userId);
document.getElementById('userLabel').textContent = '用户 ' + userId;

// 「新会话」只换 sessionId，不动 userId：对话记忆断了，训练记录还在
document.getElementById('resetBtn').onclick = () => {
  localStorage.removeItem(SESSION_KEY);
  location.reload();
};

const WORKFLOW_ID = 'fitness-coach';
// 两条分支的终点节点，各自装着这一轮的回复。取值方式不同：
//   聊天分支的输出就是字符串；
//   日志分支的输出是 {summary, report} 对象——气泡里要的是 report（summary 另有用途，见下）
const REPLY_NODES = [
  { node: 'agent_review_advice_node', field: 'report' },
  { node: 'agent_chat_node', field: null },
];

const log = document.getElementById('log');
const progressEl = document.getElementById('progress');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  input.disabled = busy;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMessage('user', text);
  setBusy(true);
  progressEl.textContent = '提交中…';

  let state;
  try {
    const resp = await fetch('/api/v1/runs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        workflowId: WORKFLOW_ID,
        sessionId: sessionId,
        wait: false,                    // 立刻返回 runId，随后用 SSE 看进度
        inputs: { userMessage: text, userId: userId }
      })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    state = await resp.json();
  } catch (e) {
    addMessage('err', '提交失败：' + e.message);
    progressEl.textContent = '';
    setBusy(false);
    return;
  }

  subscribe(state.runId);
}

// ── 订阅进度：SSE 推的是「哪个节点跑完了」，不是 token ──────────────────────
// 所以回复要等运行结束后再取一次（GET /runs/{id}）——事件只负责让你看见进度。
function subscribe(runId) {
  const es = new EventSource(`/api/v1/runs/${runId}/stream`);

  es.addEventListener('progress', async (e) => {
    const p = JSON.parse(e.data);
    if (p.type === 'NODE_COMPLETED') {
      progressEl.textContent = '✓ ' + p.nodeId;
    } else if (p.type === 'RUN_COMPLETED') {
      es.close();
      progressEl.textContent = p.status === 'SUCCEEDED' ? '' : '运行失败';
      await showResult(runId, p);
      setBusy(false);
    }
  });

  es.onerror = () => {
    // 服务端在终态后主动关闭连接，onerror 也会触发——此时运行已结束，忽略即可
    if (es.readyState === EventSource.CLOSED) return;
    es.close();
    progressEl.textContent = '进度连接中断（结果仍可查看）';
    setBusy(false);
  };
}

async function showResult(runId, progress) {
  if (progress.status !== 'SUCCEEDED') {
    addMessage('err', '运行失败：' + (progress.error || '未知原因'));
    return;
  }
  try {
    const state = await (await fetch('/api/v1/runs/' + runId)).json();
    const reply = pickReply(state.nodeOutputs || {});
    addMessage(reply ? 'bot' : 'err', reply || '运行成功，但没找到回复节点的输出');
  } catch (e) {
    addMessage('err', '取结果失败：' + e.message);
  }
}

/** 两条分支只有一条会执行，取存在的那条的输出。 */
function pickReply(nodeOutputs) {
  for (const { node, field } of REPLY_NODES) {
    const entry = nodeOutputs[node];
    if (!entry || entry.output == null) continue;
    const out = field ? entry.output[field] : entry.output;
    if (out == null) continue;
    return typeof out === 'string' ? out : JSON.stringify(out);
  }
  return null;
}

sendBtn.onclick = send;
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
input.focus();
</script>
</body>
</html>
